name: Drive Inspect (temporary)

on:
  workflow_dispatch:
    inputs:
      folder_ids:
        description: 'Comma-separated Drive folder IDs to probe by ID (from the browser URL)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Inspect Drive folders (read-only)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FOLDER_IDS: ${{ inputs.folder_ids }}
        run: |
          node <<'EOF'
          const { google } = require('googleapis');
          const oauth2Client = new google.auth.OAuth2(
            process.env.GOOGLE_CLIENT_ID,
            process.env.GOOGLE_CLIENT_SECRET,
          );
          oauth2Client.setCredentials({ refresh_token: process.env.GOOGLE_REFRESH_TOKEN });
          const drive = google.drive({ version: 'v3', auth: oauth2Client });

          const LEGACY = {
            Parcels: '1dZnLEUjDYm7JiUNu3pJyKiyPlCOXWHm1',
            Strata: '1OHeWfV64XGXc_cZwXxu0sHReVm4hioVr',
          };

          const list = async (q, extra = {}) =>
            (await drive.files.list({
              q,
              fields: 'files(id,name,parents,mimeType)',
              pageSize: 1000,
              supportsAllDrives: true,
              includeItemsFromAllDrives: true,
              ...extra,
            })).data.files || [];

          const describe = async (id) => {
            try {
              const r = await drive.files.get({ fileId: id, fields: 'id,name,mimeType', supportsAllDrives: true });
              return `${r.data.name} (${id}) [${r.data.mimeType}]`;
            } catch (e) {
              return `<inaccessible: ${e.message}>`;
            }
          };

          (async () => {
            const about = await drive.about.get({ fields: 'user' });
            console.log('Sync account:', about.data.user.emailAddress);

            for (const [label, id] of Object.entries(LEGACY)) {
              console.log(`Legacy ${label} root:`, await describe(id));
            }

            const roots = await list("name = 'Squamish Real Estate' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
            for (const r of roots) {
              console.log('Squamish Real Estate root:', await describe(r.id));
              const kids = await list(`'${r.id}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`);
              for (const k of kids) console.log(`  child folder: '${k.name}' (${k.id})`);
            }

            const webp = await list("name contains 'Webp' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
            console.log(`--- All 'Webp' folders visible (${webp.length}) ---`);
            for (const f of webp) {
              const parents = await Promise.all((f.parents || []).map(describe));
              const kids = await list(`'${f.id}' in parents and trashed = false`);
              console.log(`'${f.name}' id=${f.id} parents=[${parents.join(' | ')}] children=${kids.length}`);
            }

            for (const target of ['Parcels Webp 1', 'Strata Webp 1']) {
              const matches = await list(`name = '${target}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`);
              console.log(`EXACT MATCH '${target}': ${matches.length ? matches.map((m) => `${m.id} parents=${JSON.stringify(m.parents)}`).join(', ') : 'NOT FOUND / NOT VISIBLE'}`);
            }

            const probeIds = (process.env.FOLDER_IDS || '').split(',').map((s) => s.trim()).filter(Boolean);
            for (const id of probeIds) {
              console.log(`=== PROBE BY ID: ${id} ===`);
              try {
                const meta = await drive.files.get({ fileId: id, fields: 'id,name,mimeType,parents,trashed,owners', supportsAllDrives: true });
                console.log(`  accessible: name='${meta.data.name}' trashed=${meta.data.trashed} parents=${JSON.stringify(meta.data.parents)} owners=${JSON.stringify((meta.data.owners || []).map((o) => o.emailAddress))}`);
                try {
                  const perms = await drive.permissions.list({ fileId: id, fields: 'permissions(id,type,emailAddress,role,pendingOwner)', supportsAllDrives: true });
                  for (const p of perms.data.permissions || []) console.log(`  perm: ${p.type} ${p.emailAddress || ''} role=${p.role}${p.pendingOwner ? ' PENDING' : ''}`);
                } catch (e) { console.log(`  perms: <error: ${e.message}>`); }
                const kids = await list(`'${id}' in parents and trashed = false`);
                console.log(`  children: ${kids.length}${kids.length ? ` -> ${kids.slice(0, 8).map((k) => `'${k.name}'`).join(', ')}${kids.length > 8 ? ' ...' : ''}` : ''}`);
              } catch (e) {
                console.log(`  NOT ACCESSIBLE: ${e.message}`);
              }
            }

            const squamish = await list("name contains 'Squamish' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
            console.log(`--- name contains 'Squamish' (${squamish.length}) ---`);
            for (const f of squamish) console.log(`  '${f.name}' id=${f.id} parents=${JSON.stringify(f.parents)}`);

            const sharedWithMe = await list("sharedWithMe and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
            console.log(`--- Shared with me: folders (${sharedWithMe.length}) ---`);
            for (const f of sharedWithMe.slice(0, 50)) console.log(`  '${f.name}' id=${f.id} parents=${JSON.stringify(f.parents)}`);

            const all = await list("mimeType = 'application/vnd.google-apps.folder' and trashed = false");
            console.log(`--- ALL folders visible to this account: ${all.length} ---`);
            for (const f of all.slice(0, 200)) console.log(`  '${f.name}' id=${f.id}`);
            if (all.length > 200) console.log(`  ... and ${all.length - 200} more`);
          })().catch((e) => { console.error('INSPECT FAILED:', e.message); process.exit(1); });
          EOF
