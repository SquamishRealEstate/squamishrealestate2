name: Weekly Image Sync

on:
  # Runs automatically once a week (Sunday at midnight UTC)
  schedule:
    - cron: '0 0 * * 0'
  # Allows you to trigger the run manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-image-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Keeping Node 22 for Supabase compatibility

      - name: Install Dependencies
        run: npm install

      - name: Execute Images Script
        # Include your environment variables here if images.js needs to connect to Supabase or Bridge
        env:
          BRIDGE_API_TOKEN: ${{ secrets.BRIDGE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY }}
        # If your file is strictly JavaScript, use node. If it's TypeScript renamed to .js, use npx tsx.
        run: node images.js
