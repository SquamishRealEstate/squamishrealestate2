name: Scheduled Property Sync

on:
  schedule:
    # 11:00 AM Pacific Time (18:00 UTC)
    - cron: '0 18 * * *'
    # 3:00 PM Pacific Time (22:00 UTC)
    - cron: '0 22 * * *'
    # 7:00 PM Pacific Time (02:00 UTC, next day)
    - cron: '0 2 * * *'
  
  # This allows you to manually trigger the script from the GitHub Actions tab for testing
  workflow_dispatch: 

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ensure this matches your local Node version

      - name: Install Dependencies
        run: npm install

      - name: Execute TypeScript Script
        env:
          BRIDGE_API_TOKEN: ${{ secrets.BRIDGE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY }}
        # tsx is a fast, reliable executor for TypeScript files
        run: npx tsx rets.ts
